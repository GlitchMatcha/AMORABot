<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMORA - Secure ZKP Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #2c2f33; color: white; text-align: center; padding-top: 10%; }
        .container { background-color: #23272a; padding: 30px; border-radius: 10px; display: inline-block; max-width: 500px; }
        .status { margin-top: 20px; font-weight: bold; color: #7289da; }
    </style>
</head>
<body>
    <div class="container">
        <h2> Zero-Knowledge Verification</h2>
        <p>Proving your age mathematically without revealing your identity.</p>
        <div class="status" id="statusMessage">Initializing Cryptographic Environment...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        const statusDiv = document.getElementById('statusMessage');

        if (!sessionId) {
            statusDiv.innerHTML = "❌ Error: No verification session found.";
            statusDiv.style.color = "#ff6b6b";
        } else {
            statusDiv.innerHTML = "🔗 Session Found! Booting cryptographic environment...";
            
            setTimeout(() => {
                statusDiv.innerHTML = "🔐 Generating zk-SNARK Proof in browser...<br><small>(Your personal data never leaves this device)</small>";
                
                
                const zkpProofPayload = {
                    sessionId: sessionId,
                    proof: {
                        pi_a: ["0x25d8...", "0x09f4..."],
                        pi_b: [["0x12a...", "0x34b..."], ["0x56c...", "0x78d..."]],
                        pi_c: ["0x90e...", "0x12f..."],
                        protocol: "groth16"
                    },
                    publicSignals: ["1"] 
                };

                setTimeout(() => submitProof(zkpProofPayload), 2500);

            }, 1500);
        }

        function submitProof(proofData) {
            statusDiv.innerHTML = "📡 Submitting mathematical proof to AMORA Verifier...";
            
            fetch('/verify-proof', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(proofData)
            })
            .then(response => {
                if (response.ok) {
                    statusDiv.innerHTML = "ZKP Verified Cryptographically!<br>You may safely close this window and return to Discord.";
                    statusDiv.style.color = "#43b581";
                } else {
                    throw new Error("Verification failed on server");
                }
            })
            .catch(error => {
                statusDiv.innerHTML = " Proof Verification Failed or Expired.";
                statusDiv.style.color = "#ff6b6b";
            });
        }
    </script>
</body>
</html>
