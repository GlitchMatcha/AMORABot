<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>AMORA - 18+ Age Proof</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <h1>18+ age proof</h1>
    <p>Prove you are an adult using the chip in your passport or ID card. A zero-knowledge proof is generated on your phone; AMORA receives only "18 or older" and a one-way ID fingerprint that stops one document from verifying several accounts.</p>
    <a id="login" class="btn" hidden>Log in with Discord</a>
    <div id="zkpassport"></div>
    <p id="status" class="status" data-kind="info">Loading...</p>
  </main>
  <script type="module" src="/client.js"></script>
</body>
</html>
